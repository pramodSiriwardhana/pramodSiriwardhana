<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="How I build"><style>.fl{animation:f 6s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}</style><g class="fl" style="animation-delay:0.0s"><rect x="60" y="10" width="253" height="140" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".6"/><text x="82" y="52" font-size="30" font-weight="900" fill="#38bdf8" opacity=".9" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace">01</text><text x="82" y="86" font-size="16" font-weight="800" letter-spacing="1" fill="#f1f5f9" font-family="'Segoe UI','Inter',Arial,sans-serif">PURPOSE-DRIVEN</text><text x="82" y="112" font-size="12.5" fill="#94a3b8" font-family="'Segoe UI','Inter',Arial,sans-serif">Every feature solves a real problem</text></g><g class="fl" style="animation-delay:0.5s"><rect x="337" y="10" width="253" height="140" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-opacity=".6"/><text x="359" y="52" font-size="30" font-weight="900" fill="#a78bfa" opacity=".9" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace">02</text><text x="359" y="86" font-size="16" font-weight="800" letter-spacing="1" fill="#f1f5f9" font-family="'Segoe UI','Inter',Arial,sans-serif">CLEAN &amp; SCALABLE</text><text x="359" y="112" font-size="12.5" fill="#94a3b8" font-family="'Segoe UI','Inter',Arial,sans-serif">Maintainable architecture from day one</text></g><g class="fl" style="animation-delay:1.0s"><rect x="614" y="10" width="253" height="140" rx="16" fill="#0b1220" stroke="#ec4899" stroke-opacity=".6"/><text x="636" y="52" font-size="30" font-weight="900" fill="#ec4899" opacity=".9" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace">03</text><text x="636" y="86" font-size="16" font-weight="800" letter-spacing="1" fill="#f1f5f9" font-family="'Segoe UI','Inter',Arial,sans-serif">USER-FOCUSED</text><text x="636" y="112" font-size="12.